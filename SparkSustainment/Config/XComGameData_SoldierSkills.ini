;===========================================================================
; SPARK Sustainment - XComGameData_SoldierSkills.ini
; Part 4 of 5: SPARK abilities
;
; One deliberate nerf in here (SACRIFICE_COOLDOWN). See README "Trade-offs".
;===========================================================================

[DLC_3.X2Ability_SparkAbilitySet]

; Vanilla 5 -> 4. Overdrive is the reason to bring a SPARK at all and it is
; on a five-turn leash in a game where most fights last three.
OVERDRIVE_COOLDOWN = 4

; Vanilla 1 -> 2. Bulwark is a filler perk that costs a real slot; it should
; at least out-armour a plated torso.
BULWARK_ARMOR = 2

; Vanilla 2 -> 3 charges.
REPAIR_CHARGES = 3
; Vanilla 6 -> 8 HP per charge.
REPAIR_HP = 8

; Vanilla 33 -> 50. Hunter Protocol firing a third of the time is why nobody
; takes it over Bombard.
HUNTERPROTOCOL_CHANCE = 50

; Vanilla 4 -> 5. Sacrifice is one of the strongest buttons in the game and
; the chassis buffs above make the SPARK survive using it. Cost it one turn
; of uptime so it stays a decision instead of a rotation.
SACRIFICE_COOLDOWN = 5


; The aim penalty Overdrive applies to its own follow-up shots.
; Vanilla -15 -> -10. At -15 a three-shot Overdrive turn is usually one hit
; and two misses, which reads as "SPARKs can't shoot" rather than
; "Overdrive is a burst you have to set up".
[DLC_3.X2Effect_DLC_3Overdrive]
ShotModifier = -10
