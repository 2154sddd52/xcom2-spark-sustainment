;===========================================================================
; SPARK Sustainment - XComGameData_WeaponData.ini
; Part 3 of 5: SPARK RIFLE, SPARK BIT, and the death detonation
;
; Damage is untouched on purpose. A beam SPARK RIFLE already sits at 9-10
; against a plasma rifle's 8-10; the problem was never the damage number.
;===========================================================================

[DLC_3.X2Item_DLC_Day90Weapons]

; Vanilla 3 -> 4 for all three tiers.
; Overdrive is the SPARK's whole identity, and Overdrive chains die to an
; empty magazine far more often than to bad aim. Four rounds means a clean
; three-shot Overdrive turn still leaves a round in the gun.
SPARKRIFLE_CONVENTIONAL_ICLIPSIZE = 4
SPARKRIFLE_MAGNETIC_ICLIPSIZE = 4
SPARKRIFLE_BEAM_ICLIPSIZE = 4

; Vanilla 0 / 10 / 20 -> 10 / 20 / 30.
; Pairs with the Hacking stat bump. A tier-1 BIT now actually opens a door
; on the first attempt instead of being a decoration.
SPARKBIT_CONVENTIONAL_HACKBONUS = 10
SPARKBIT_MAGNETIC_HACKBONUS = 20
SPARKBIT_BEAM_HACKBONUS = 30

; Vanilla (Damage=3, Spread=0, PlusOne=25, Crit=0, Pierce=0, Shred=2).
; The signature change in this mod. A SPARK that dies is a 100+ supply,
; 14-day loss that until now also politely scratched the nearest pod for 3.
; It now lands 4-6 with 3 shred - enough that losing the chassis at least
; buys the squad a turn.
SPARK_DEATH_EXPLOSION_BASEDAMAGE= (Damage=4, Spread = 0, PlusOne = 50, Crit = 0, Pierce = 0, Shred=3, Tag = "", DamageType="Explosion")
