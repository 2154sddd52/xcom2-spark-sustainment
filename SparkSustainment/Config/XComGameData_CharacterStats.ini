;===========================================================================
; SPARK Sustainment - XComGameData_CharacterStats.ini
; Part 2 of 5: SPARK chassis stats
;
; NOTE ON DIFFICULTY SECTIONS
; The base SparkSoldier block is not the whole story. WotC ships four
; difficulty variants (SparkSoldier_Diff_0 .. _3) that re-declare HP, Will,
; FlankingCritChance and Hacking. Those variants are applied AFTER the base
; block, so editing only the base block gets you nothing on HP or Hacking.
; Every difficulty section is therefore mirrored here with the same numbers,
; which keeps the SPARK identical across all four difficulty levels.
;
; LostTowersSpark (the scripted SPARK you drive in the Shen's Last Gift
; mission) is deliberately left alone - it is a story unit, not a roster unit.
;===========================================================================

[SparkSoldier X2SparkCharacterTemplate_DLC_3]
; Vanilla 10 -> 12. A SPARK has no cover, no bonds and no PCS; it eats every
; flank shot in the open. Two extra points buys it one more bad turn.
CharacterBaseStats[eStat_HP]=12
; Vanilla 15 -> 20.
CharacterBaseStats[eStat_Defense]=20
; Vanilla 12 -> 13. One tile of extra reach on blue moves.
CharacterBaseStats[eStat_Mobility]=13
; Vanilla 5 -> 15. A machine that cannot hack is a joke, and the SPARK BIT
; hack bonus (buffed in the weapon file) stacks on top of this.
CharacterBaseStats[eStat_Hacking]=15

[SparkSoldier_Diff_0 X2SparkCharacterTemplate_DLC_3]
CharacterBaseStats[eStat_HP]=13
CharacterBaseStats[eStat_Will]=50
CharacterBaseStats[eStat_Hacking]=15

[SparkSoldier_Diff_1 X2SparkCharacterTemplate_DLC_3]
CharacterBaseStats[eStat_HP]=12
CharacterBaseStats[eStat_Will]=40
CharacterBaseStats[eStat_FlankingCritChance]=40
CharacterBaseStats[eStat_Hacking]=15

