;===========================================================================
; SPARK Sustainment - XComGameData.ini
; Part 1 of 5: field repair rate
;
; Everything here lives under DLC_3 (Shen's Last Gift), which is the DLC that
; owns the SPARK. WotC loads that config layer whether or not you tick
; "Integrated DLC" in the campaign settings, so these values apply in both
; integrated and non-integrated runs.
;===========================================================================

[DLC_3.XComGameState_SparkManager]

; How fast a damaged SPARK is put back together in the Proving Ground.
; Vanilla: 80. Repair time scales inversely with this number, so 40 is
; roughly half the downtime. SPARKs cannot use the Infirmary and cannot be
; healed by a Specialist, so this is the only lever they have.
BaseSparkHealRate=40
